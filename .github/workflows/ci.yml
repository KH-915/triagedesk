name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triagedesk
          POSTGRES_PASSWORD: triagedesk
          POSTGRES_DB: triagedesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triagedesk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://triagedesk:triagedesk@localhost:5432/triagedesk_test
      TEST_DATABASE_URL: postgresql://triagedesk:triagedesk@localhost:5432/triagedesk_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - run: npm --workspace=services/api run lint
      - run: npm run test:api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm --workspace=apps/web run build

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python training/generate_data.py && python training/train.py
      - run: python -m pytest -q
